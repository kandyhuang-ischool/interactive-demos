<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>課堂點名互動體驗</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@400;600&display=swap">
<style>
:root{
  --bg:#EEF2F3; --surface:#FFFFFF; --surface-2:#F5F7F8; --line:#E1E6E9; --line-2:#C9D1D6;
  --ink:#1F2A30; --ink-2:#4A5A63; --muted:#7B8A92;
  --accent:#2B7FD0; --accent-ink:#FFFFFF; --accent-soft:#E3F0FB;
  --teal:#9FCFC7; --teal-2:#C9E6E1; --teal-ink:#1E5B52;
  --ok:#22A06B; --warn:#F08A24; --bad:#D8283E;
  --shadow:0 8px 28px rgba(31,42,48,.10);
  --cream:#F4ECE1; --paper:#FBF6EE; --taupe:#5B554D; --taupe-2:#8C857B; --hair:#D9CFC2;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14191C; --surface:#1D2428; --surface-2:#242C31; --line:#33404A; --line-2:#465562;
    --ink:#EAF0F3; --ink-2:#C0CBD2; --muted:#8B98A1; --accent:#6FB0F0; --accent-ink:#0E1A26; --accent-soft:#1E3448;
    --teal:#2F5C55; --teal-2:#254A45; --teal-ink:#BFE5DD; --shadow:0 8px 28px rgba(0,0,0,.45);
    --cream:#1B1815; --paper:#241F1B; --taupe:#EAE1D6; --taupe-2:#A99E91; --hair:#3D352E;
  }
}
:root[data-theme="dark"]{
  --bg:#14191C; --surface:#1D2428; --surface-2:#242C31; --line:#33404A; --line-2:#465562;
  --ink:#EAF0F3; --ink-2:#C0CBD2; --muted:#8B98A1; --accent:#6FB0F0; --accent-ink:#0E1A26; --accent-soft:#1E3448;
  --teal:#2F5C55; --teal-2:#254A45; --teal-ink:#BFE5DD; --shadow:0 8px 28px rgba(0,0,0,.45);
  --cream:#1B1815; --paper:#241F1B; --taupe:#EAE1D6; --taupe-2:#A99E91; --hair:#3D352E;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
body.at-home{background:var(--cream)}
.wrap{max-width:1240px;margin:0 auto;padding-block:20px 40px;padding-inline:16px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
button{font:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ================= HOME ================= */
.home{min-height:calc(100vh - 60px);display:grid;grid-template-columns:minmax(280px,420px) minmax(300px,520px);gap:56px;align-items:center;justify-content:center;padding-block:24px}
@media (max-width:860px){.home{grid-template-columns:minmax(0,420px);gap:28px;justify-items:center}}
.poster{background:var(--paper);padding:26px 26px 0;box-shadow:0 30px 80px rgba(80,50,20,.14);width:100%}
.poster .art{position:relative;aspect-ratio:3/4;overflow:hidden;background:#E9EEF1}
.poster .art i{position:absolute;border-radius:50%;filter:blur(34px);opacity:.6}
.poster .art .a1{width:120%;height:95%;left:-45%;bottom:-25%;background:radial-gradient(circle at 60% 40%,#8FC9D8,#4E9AB5 60%,#2C6A85 100%)}
.poster .art .a2{width:80%;height:60%;left:5%;top:-10%;background:radial-gradient(circle,#F9D9A0,#F2B96A 60%,transparent 100%)}
.poster .art .a3{width:85%;height:75%;right:-25%;top:5%;background:radial-gradient(circle at 40% 40%,#F7A7A0,#EC7C7C 55%,transparent 100%)}
.poster .art .a4{width:70%;height:50%;right:-15%;bottom:-5%;background:radial-gradient(circle,#DCEBF0,transparent 70%)}
.poster .art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,0) 40%,rgba(251,246,238,.35));pointer-events:none}
.mascots{position:absolute;inset:0;z-index:2;display:flex;align-items:flex-end;justify-content:center;padding:0 0 6%}
.mascots canvas{width:100%;height:84%;display:block}
.poster .cap{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;text-align:center;color:var(--taupe);padding:26px 8px 30px;font-size:clamp(22px,3vw,30px);line-height:1.3}
.poster .cap .rule{width:70%;height:1px;background:var(--hair);margin:10px auto}
.entry{color:var(--taupe);width:100%}
.entry .eyebrow{font-size:12px;letter-spacing:.22em;color:var(--taupe-2);text-transform:uppercase}
.entry h1{font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;font-weight:600;font-size:clamp(28px,3.4vw,40px);line-height:1.25;margin:8px 0 14px;color:var(--taupe)}
.entry p.lead{margin:0 0 28px;color:var(--taupe-2);font-size:15px;line-height:1.8;max-width:34em}
.entry .hair{height:1px;background:var(--hair);margin:0 0 6px}
.role{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:16px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--hair);padding:18px 6px;color:var(--taupe);transition:background .15s}
.role:hover{background:rgba(255,255,255,.35)}
.role .no{font-family:"Noto Serif TC",serif;font-size:22px;color:var(--taupe-2)}
.role .t{font-family:"Noto Serif TC",serif;font-size:20px;font-weight:600}
.role .t small{display:block;font-family:"Noto Sans TC",sans-serif;font-size:13px;font-weight:400;color:var(--taupe-2);margin-top:2px;line-height:1.6}
.role .arr{font-size:20px;color:var(--taupe-2);transition:transform .15s}
.role:hover .arr{transform:translateX(4px);color:var(--taupe)}
.entry .foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px;font-size:12px;color:var(--taupe-2)}
.linkbtn{background:none;border:1px solid var(--hair);color:var(--taupe-2);border-radius:999px;padding:6px 14px;font-size:12px}
.linkbtn:hover{color:var(--taupe);border-color:var(--taupe-2)}

/* ================= STAGE LAYOUT ================= */
.stage{max-width:1100px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.topbar .who{font-weight:700;color:var(--ink)}
.topbar .who small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.sp{flex:1}
.menubtn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 16px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px;box-shadow:0 2px 8px rgba(43,127,208,.3)}
.menubtn:hover{filter:brightness(1.08)}
.duo{display:grid;grid-template-columns:400px 1fr;gap:28px;align-items:start;justify-content:center}
@media (max-width:860px){.duo{grid-template-columns:minmax(0,400px);justify-items:center}}

/* phone frame */
.phone{width:400px;max-width:100%;background:#111418;border-radius:44px;padding:12px;box-shadow:0 30px 60px rgba(0,0,0,.28),inset 0 0 0 2px #2b3138;position:relative}
.phone .screen{background:var(--surface);border-radius:34px;overflow:hidden;height:780px;display:flex;flex-direction:column;position:relative}
.phone .notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:120px;height:28px;background:#111418;border-radius:0 0 18px 18px;z-index:5}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:12px 26px 0;font-size:12px;font-weight:700;color:var(--ink);height:40px}
.statusbar .time{background:#D8283E;color:#fff;border-radius:6px;padding:1px 7px;font-size:11px}
.apphdr{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;font-size:15px;color:var(--ink)}
.apphdr .x{font-size:20px;color:var(--ink-2);line-height:1}
.scr{flex:1;overflow:auto;padding:0 12px 16px;scrollbar-width:thin}
.scr.center{display:flex;flex-direction:column}
.foot-pw{text-align:center;color:var(--muted);font-size:12px;padding:12px 0 4px;margin-top:auto}

/* ---- teacher app widgets (light teal, like video) ---- */
.tt{font-weight:700;font-size:14px;margin:6px 4px 8px;display:flex;align-items:center;gap:8px}
.tt .btn-s{margin-left:auto}
.btn-s{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:4px 10px;font-size:12px;color:var(--ink)}
.btn-s.dark{background:#333;border-color:#333;color:#fff}
.btn-s.blue{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-s.teal{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
table.app{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
table.app th{background:var(--teal-2);color:var(--teal-ink);font-weight:700;padding:8px 8px;text-align:left;font-size:12px}
table.app td{padding:9px 8px;border-top:1px solid var(--line);background:var(--surface)}
table.app tr.row{cursor:pointer}
table.app tr.row:hover td{background:var(--accent-soft)}
table.app tr.hot td{animation:pulse 1.6s infinite}
table.app td.c,table.app th.c{text-align:center}
.ck{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:2px solid #CFE3F4;color:#CFE3F4;font-size:11px;font-weight:900}
.ck.on{background:var(--accent);border-color:var(--accent);color:#fff}
.rowbtns{display:flex;justify-content:flex-end;gap:6px;margin:8px 0}
.course{display:flex;justify-content:space-between;align-items:center;padding:10px 8px;border-top:1px solid var(--line);font-size:13px;cursor:pointer}
.course:hover{background:var(--accent-soft)}
.course .hp{color:var(--ink-2);font-size:12px;text-align:right}
.course .hp b{color:var(--ink)}
@keyframes pulse{0%,100%{box-shadow:inset 0 0 0 0 var(--accent-soft)}50%{box-shadow:inset 0 0 0 3px var(--accent-soft)}}
/* roll call (teacher) */
.crumb{display:flex;align-items:center;gap:6px;background:var(--teal-2);color:var(--teal-ink);border-radius:8px;padding:8px 10px;font-size:13px;margin:4px 0 8px}
.crumb b{font-weight:700}
.crumb .back{border:0;background:none;color:var(--teal-ink);font-weight:700;padding:0 2px}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);margin:2px 4px 8px}
.chk i{width:12px;height:12px;border:1px solid var(--line-2);border-radius:2px;display:inline-block}
.tools{display:flex;align-items:center;gap:8px;margin-bottom:6px;position:relative}
.dd{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:5px 10px;font-size:12px;display:inline-flex;gap:6px;align-items:center}
.dd.filled{background:var(--accent);border-color:var(--accent);color:#fff}
.ddmenu{position:absolute;top:100%;left:0;margin-top:4px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:8px;padding:4px;z-index:6;min-width:110px}
.ddmenu button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:6px;color:var(--ink);font-size:13px}
.ddmenu button:hover{background:var(--surface-2)}
.ddmenu button.cur{background:var(--accent-soft);font-weight:700}
.rednote{color:var(--bad);font-size:11.5px;margin:0 4px 8px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.05);cursor:pointer;text-align:left;padding:0;color:var(--ink)}
.card:hover{border-color:var(--accent)}
.card .ph{position:relative;aspect-ratio:3/4;background:#DDE3E8;overflow:hidden}
.card .ph .face{position:absolute;inset:0}
.card .ph .face::before{content:"";position:absolute;left:50%;top:22%;width:44%;height:40%;transform:translateX(-50%);border-radius:50% 50% 46% 46%;background:#F3D7C3;filter:blur(1px)}
.card .ph .face::after{content:"";position:absolute;left:50%;bottom:-6%;width:86%;height:40%;transform:translateX(-50%);border-radius:50% 50% 0 0;background:#F6F8FA;filter:blur(1px)}
.card .ph .hair{position:absolute;left:50%;top:14%;width:52%;height:30%;transform:translateX(-50%);border-radius:50% 50% 30% 30%;background:#2B2622;filter:blur(1.5px)}
.card .ph .hair.long{height:52%;border-radius:50% 50% 20% 20%}
.card .ph .blur{position:absolute;inset:0;backdrop-filter:blur(4px)}
.card .st{position:absolute;left:8px;right:8px;bottom:8px;border-radius:4px;color:#fff;font-weight:700;font-size:12px;text-align:center;padding:4px 0}
.card .st.abs{background:var(--bad)}.card .st.late{background:var(--warn)}
.card .st.helper{background:#1E9E4E}
.card .meta{padding:6px 8px 8px;font-size:12px;color:var(--ink-2)}
.card .meta .n{display:flex;justify-content:space-between;color:var(--ink);font-weight:700}
.card .meta .n span:last-child{font-weight:500;font-size:11px}
.card .meta .n .low{color:var(--bad)}
.card .meta .i{display:flex;justify-content:space-between;margin-top:2px}
.card.selected{outline:2px solid #1E9E4E}
/* settings */
.set{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:10px}
.set .sh{background:var(--teal-2);color:var(--teal-ink);font-weight:700;padding:8px 10px;display:flex;align-items:center;font-size:13px}
.set .sh .btn-s{margin-left:auto}
.set .r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--line);font-size:13px}
.set .r small{display:block;color:var(--muted);font-size:11px}
.radio{display:inline-flex;gap:10px;font-size:12px}
.radio i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--line-2);display:inline-block;vertical-align:-2px;margin-right:3px}
.radio i.on{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 45%,transparent 50%)}
.pw{border:1px solid var(--line-2);border-radius:6px;padding:3px 10px;font-size:13px;letter-spacing:.3em;background:var(--surface-2)}
/* helper app (blue, like video) */
.h-title{font-weight:700;font-size:15px;margin:8px 8px 6px}
.chips{display:flex;gap:8px;margin:0 8px 12px}
.chip{border:1px solid #CFE3F4;background:#EAF3FB;color:#2B7FD0;border-radius:999px;padding:2px 10px;font-size:11px}
.chip b{margin-left:4px}
table.happ{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
table.happ th{background:#CFE4F6;color:#1F2A30;padding:9px 10px;text-align:left;font-weight:700}
table.happ td{padding:10px;border-top:1px solid var(--line);background:var(--surface);font-weight:700}
table.happ tr:nth-child(even) td{background:var(--surface-2)}
table.happ th.c,table.happ td.c{text-align:center;font-weight:500}
table.happ tr.row{cursor:pointer}
table.happ tr.row:hover td{background:var(--accent-soft)}
.badge{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#2B7FD0;color:#fff;font-size:11px;font-weight:700}
.hcrumb{background:#CFE4F6;border-radius:8px;padding:10px 12px;font-size:14px;margin:6px 0 10px;display:flex;align-items:center;gap:8px}
.hcrumb .back{border:0;background:none;padding:0;font:inherit;color:var(--ink)}
.hcrumb b{font-weight:700}
.htools{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;position:relative}
.hbtn{background:#2B7FD0;color:#fff;border:0;border-radius:6px;padding:7px 12px;font-weight:700;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.hbtn.light{background:#6FB0F0}
.hbtn[disabled]{opacity:.5}
.srow{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:10px;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.srow .nm{font-weight:700;font-size:14px}
.srow .id{color:var(--ink-2);font-weight:700;font-size:13px}
.srow .seat{font-weight:700;color:var(--ink-2);margin-right:12px;font-size:13px}
.srow .stb{min-width:76px;border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:9px 0;font-weight:700;color:var(--muted);font-size:13px}
.srow .stb.abs{background:var(--bad);border-color:var(--bad);color:#fff}
.srow .stb.late{background:var(--warn);border-color:var(--warn);color:#fff}
.srow .stb:hover{border-color:var(--accent)}
/* in-phone dialog */
.pdlg{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:8;display:grid;place-items:start center;padding-top:40px}
.pdlg .box{background:var(--surface);border-radius:10px;box-shadow:var(--shadow);width:min(300px,90%);padding:16px 18px;position:relative}
.pdlg h4{font-size:16px;font-weight:700}
.pdlg .x{position:absolute;right:10px;top:8px;border:0;background:none;color:var(--muted);font-size:16px}
.pdlg p{margin:12px 0 0;font-size:13px;color:var(--ink-2)}
.pdlg .pwrow{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px}
.pdlg input{flex:1;border:1px solid var(--accent);border-radius:4px;padding:5px 8px;font:inherit;letter-spacing:.3em;color:var(--ink);background:var(--surface)}
.pdlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
/* period picker */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.pbtn{border:2px solid #2B7FD0;background:var(--surface);color:var(--ink);border-radius:6px;padding:9px 0;font-size:14px;font-weight:600}
.pbtn:hover:not([disabled]){background:var(--accent-soft)}
.pbtn[disabled]{border-color:var(--line);color:var(--line-2);background:var(--surface-2);cursor:not-allowed}
/* date dropdown */
.daterow{display:flex;align-items:center;gap:10px;margin:8px 4px 8px}
.dlabel{font-weight:700;font-size:14px}
.dsel-wrap{position:relative}
.dsel{border:1px solid #CFE3F4;background:#EAF3FB;color:#1F2A30;border-radius:6px;padding:6px 10px;font-size:13px;font-weight:600;display:inline-flex;gap:8px;align-items:center}
.dsel span{color:var(--muted)}
.dmenu{min-width:190px;font-size:13px}
/* date picker (legacy) */
.datebtn{border:0;background:none;padding:0;font:inherit;font-weight:700;font-size:14px;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.datebtn .cal-ic{font-size:13px;opacity:.75}
.datebtn:hover{color:var(--accent)}
.dnav{text-align:center;font-weight:700;margin:10px 0 6px;color:var(--ink)}
.dgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dgrid .dow{font-size:12px;color:var(--muted);padding:4px 0}
.dbtn{border:1px solid transparent;background:none;border-radius:8px;padding:7px 0;font-size:13px;color:var(--ink)}
.dbtn:hover:not([disabled]){background:var(--accent-soft)}
.dbtn.today{border-color:var(--accent);font-weight:700}
.dbtn.cur{background:var(--accent);color:#fff}
.dbtn[disabled]{color:var(--line-2);cursor:not-allowed}
/* success/state banner inside phone */
.pbanner{margin:6px 0 10px;border-radius:8px;padding:9px 12px;font-size:12.5px;display:flex;gap:8px;align-items:flex-start}
.pbanner.ok{background:#E7F8EF;color:#1D7A4A;border:1px solid #9FDDB8}
.pbanner.info{background:var(--accent-soft);color:var(--accent);border:1px solid #BFD9F2}
.pbanner.warn{background:#FFF3E0;color:#9A5A0B;border:1px solid #F5D4A6}
.pbanner b{display:block}
.pbanner .btn-s{margin-left:auto;white-space:nowrap}

/* ---- side panel: SIS ---- */
.side{display:grid;gap:14px}
.sis{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.sis .hd{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);font-weight:700;font-size:13px}
.sis .hd .pill{margin-left:auto}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.pill.g{background:#E7F8EF;color:#1D7A4A}.pill.n{background:var(--surface-2);color:var(--muted)}.pill.y{background:#FFF3C4;color:#7A5A00}
table.mini{width:100%;border-collapse:collapse;font-size:13px}

class XuebaoMascot {
  constructor(canvas, options = {}) {
    if (!(canvas instanceof HTMLCanvasElement)) {

    this.frame = null;

  tick(now) {
    this.frame = null;
    if (this.destroyed || this.paused || document.hidden) return;
    const dt = this.lastTime === null ? 0 : Math.max(0, (now - this.lastTime) / 1000);
    this.lastTime = now;
    this.clock += dt * 1000;
    this.updateBlink();
    this.updateGaze(dt);
    this.draw();
    this.frame = requestAnimationFrame(this._tick);
  }

  beginBlink(manual = false) {
    if (this.blinkStarted !== null) return false;
    this.blinkStarted = this.clock;
    this.blinkDuration = 175 + Math.random() * 35;
    this.nextBlink = this.clock + this.randomBlinkDelay();
    this.blinkCount += 1;
    // A small event API is also useful when embedding the character elsewhere.
    this.canvas.dispatchEvent(new CustomEvent('xuebao:blink', {
      detail: {
        manual, at: this.clock,
        nextDelayMs: this.nextBlink - this.clock
      }
    }));
    return true;
  }

  updateBlink() {
    if (this.blinking && this.blinkStarted === null && this.clock >= this.nextBlink) {
      this.beginBlink(false);
    }
    if (this.blinkStarted === null) { this.eyeOpen = 1; return; }
    const u = (this.clock - this.blinkStarted) / this.blinkDuration;
    const smooth = n => { const v = Math.max(0, Math.min(1, n)); return v * v * (3 - 2 * v); };
    // Close -> hold briefly -> reopen. Both eyes use the same blink state.
    if (u >= 1) {
      this.blinkStarted = null;
      this.eyeOpen = 1;
    } else if (u < 0.40) {
      this.eyeOpen = 1 - smooth(u / 0.40);
    } else if (u < 0.57) {
      this.eyeOpen = 0;
    } else {
      this.eyeOpen = smooth((u - 0.57) / 0.43);
    }
  }

  updateGaze(dt) {
    let targetX = 0;
    let targetY = 0;
    if (this.tracking && this.pointer.active) {
      const rect = this.canvas.getBoundingClientRect();
      const { scale, x, y } = this.view;
      const p = this.pose();
      const worldX = (this.pointer.clientX - rect.left - x) / scale;
      const worldY = (this.pointer.clientY - rect.top - y) / scale;
      // Invert the torso's gentle idle rotation/translation as well.
      const dx = worldX - 300;
      const dy = worldY - (420 + p.bob);
      const cos = Math.cos(p.tilt);
      const sin = Math.sin(p.tilt);
      const localX = dx * cos + dy * sin + 300;
      const localY = -dx * sin + dy * cos + 420;
      const vx = localX - 300;
      const vy = localY - 310;
      const distance = Math.hypot(vx, vy);
      const strength = Math.min(distance / 145, 1);
      if (distance > 0.001) {
        // An elliptical limit keeps each pupil inside the eye white.
        targetX = (vx / distance) * 4.5 * strength;
        targetY = (vy / distance) * 4.0 * strength;
      }
    }
    // Exponential easing gives equivalent responsiveness at different frame rates.
    const ease = this.motionQuery.matches ? 1 : 1 - Math.exp(-13 * dt);
    this.gaze.x += (targetX - this.gaze.x) * ease;
    this.gaze.y += (targetY - this.gaze.y) * ease;
  }

  gradient(x0, y0, x1, y1, stops) {
    const gradient = this.ctx.createLinearGradient(x0, y0, x1, y1);
    stops.forEach(([offset, color]) => gradient.addColorStop(offset, color));
    return gradient;
  }

  ellipse(x, y, rx, ry, fill) {
    const c = this.ctx;
    c.beginPath();
    c.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    c.fillStyle = fill;
    c.fill();
  }

  draw() {
    if (this.destroyed) return;
    const c = this.ctx;
    const v = this.view;
    const p = this.pose();
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.clearRect(0, 0, this.canvas.width, this.canvas.height);
    c.setTransform(v.dpr * v.scale, 0, 0, v.dpr * v.scale, v.dpr * v.x, v.dpr * v.y);
    c.lineCap = 'round';
    c.lineJoin = 'round';

    this.ellipse(300, 650, 145, 11, 'rgba(62, 75, 65, 0.075)');
    this.ellipse(300, 650, 100, 6, 'rgba(62, 75, 65, 0.028)');
    this.drawLegs(p);

    c.save();
    c.translate(300, 420 + p.bob);
    c.rotate(p.tilt);
    c.translate(-300, -420);
    this.drawArms();
    this.drawBody();
    this.drawCap(p);
    this.drawFace();
    this.drawBook();
    c.restore();
  }

  drawLegs(p) {
    const c = this.ctx;
    c.strokeStyle = this.gradient(235, 442, 358, 604, [[0, '#FFC514'], [0.5, '#FFD335'], [1, '#FFB919']]);
    c.lineWidth = 17;
    c.beginPath();
    c.moveTo(250 - p.tilt * 15, 437 + p.bob);
    c.quadraticCurveTo(242, 521, 239, 608);
    c.moveTo(339 - p.tilt * 15, 437 + p.bob);
    c.quadraticCurveTo(347, 525, 352, 608);
    c.stroke();
    c.strokeStyle = 'rgba(255, 232, 94, 0.5)';
    c.lineWidth = 3.5;
    c.beginPath();
    c.moveTo(246, 449 + p.bob);
    c.lineTo(236, 590);
    c.moveTo(336, 449 + p.bob);
    c.lineTo(348, 590);
    c.stroke();
    c.fillStyle = this.gradient(230, 594, 230, 650, [[0, '#FFAA09'], [1, '#FF9600']]);
    c.fill(this.paths.leftBoot);
    c.fill(this.paths.rightBoot);
    c.fillStyle = 'rgba(230, 132, 0, 0.1)';
    c.beginPath();
    c.roundRect(202, 645, 50, 3, 1.5);
    c.roundRect(341, 645, 48, 3, 1.5);
    c.fill();
  }

  drawArms() {
    const c = this.ctx;
    c.strokeStyle = this.gradient(158, 270, 498, 404, [[0, '#FFCE24'], [1, '#FFCA13']]);
    c.lineWidth = 16;
    c.beginPath();
    c.moveTo(204, 365);
    c.bezierCurveTo(162, 341, 137, 378, 151, 402);
    c.moveTo(403, 345);
    c.bezierCurveTo(447, 361, 474, 328, 486, 295);
    c.stroke();
    c.fillStyle = this.gradient(475, 251, 507, 305, [[0, '#FFDF3C'], [1, '#FFCA18']]);
    c.fill(this.paths.raisedHand);
    c.strokeStyle = 'rgba(241, 173, 0, 0.45)';
    c.lineWidth = 1.2;
    c.beginPath();
    c.moveTo(483, 288);
    c.quadraticCurveTo(488, 282, 494, 285);
    c.stroke();
  }

  drawBody() {
    const c = this.ctx;
    c.fillStyle = this.gradient(196, 206, 390, 443, [
      [0, '#FFD52A'], [0.43, '#FFDC35'], [0.78, '#FFCD18'], [1, '#FFD331']
    ]);
    c.fill(this.paths.body);
    c.strokeStyle = 'rgba(236, 167, 0, 0.28)';
    c.lineWidth = 1.1;
    c.stroke(this.paths.body);
    c.save();
    c.clip(this.paths.body);
    const glow = c.createRadialGradient(238, 253, 0, 238, 253, 165);
    glow.addColorStop(0, 'rgba(255, 244, 144, 0.17)');
    glow.addColorStop(1, 'rgba(255, 244, 144, 0)');
    c.fillStyle = glow;
    c.fillRect(145, 175, 305, 280);
    c.restore();
  }

  drawCap(p) {
    const c = this.ctx;
    c.fillStyle = this.gradient(260, 162, 336, 192, [[0, '#16364E'], [1, '#234860']]);
    c.fill(this.paths.capBand);
    c.fillStyle = this.gradient(253, 133, 348, 185, [[0, '#263E52'], [1, '#162F44']]);
    c.fill(this.paths.capTop);
    c.strokeStyle = '#102838';
    c.lineWidth = 2.2;
    c.stroke(this.paths.capTop);
    c.strokeStyle = 'rgba(255, 255, 255, 0.07)';
    c.lineWidth = 1.8;
    c.beginPath();
    c.moveTo(230, 157);
    c.lineTo(298, 127);
    c.lineTo(368, 158);
    c.stroke();
    this.ellipse(299, 157, 4.4, 2.9, '#193145');
    c.save();
    c.translate(371, 162);
    c.rotate(p.tassel);
    c.strokeStyle = '#FF9229';
    c.lineWidth = 2.6;
    c.beginPath();
    c.moveTo(0, 0);
    c.lineTo(0, 35);
    c.stroke();
    this.ellipse(0, 35, 3.5, 4.5, '#FF8B23');
    c.fillStyle = this.gradient(-4, 36, 4, 54, [[0, '#FFAC3B'], [1, '#FF8420']]);
    c.beginPath();
    c.moveTo(-2.4, 37);
    c.lineTo(-5.2, 52);
    c.quadraticCurveTo(0, 56, 5.2, 52);
    c.lineTo(2.4, 37);
    c.closePath();
    c.fill();
    c.restore();
  }

  drawFace() {
    const c = this.ctx;
    this.ellipse(300, 326, 83, 82, this.gradient(256, 253, 336, 405, [[0, '#FFF8E9'], [1, '#FFF0D4']]));
    c.strokeStyle = 'rgba(255, 255, 255, 0.86)';
    c.lineWidth = 1.7;
    c.stroke();
    this.ellipse(236, 343, 14, 14, '#FF9184');
    this.ellipse(364, 343, 14, 14, '#FF9184');
    this.ellipse(233, 339, 7, 4, 'rgba(255, 192, 169, 0.35)');
    this.ellipse(361, 339, 7, 4, 'rgba(255, 192, 169, 0.35)');
    this.drawEye(258, 310);
    this.drawEye(342, 310);
    this.ellipse(300, 343, 12, 5.5, 'rgba(246, 181, 137, 0.4)');
    c.fillStyle = '#982A22';
    c.fill(this.paths.mouth);
    c.strokeStyle = '#8D241E';
    c.lineWidth = 1.1;
    c.stroke(this.paths.mouth);
    c.save();
    c.clip(this.paths.mouth);
    this.ellipse(300, 383, 24, 14, '#FF6759');
    this.ellipse(300, 384, 18, 8, 'rgba(255, 135, 110, 0.4)');
    c.restore();
  }

  drawEye(x, y) {
    const c = this.ctx;
    const open = Math.max(0, Math.min(1, this.eyeOpen));
    c.save();
    c.translate(x, y);
    if (open < 0.08) {
      c.strokeStyle = '#252C2A';
      c.lineWidth = 3.8;
      c.beginPath();
      c.moveTo(-10, 0);
      c.quadraticCurveTo(0, 5, 10, 0);
      c.stroke();
    } else {
      c.scale(1, open);
      this.ellipse(0, 0, 14.5, 18, 'rgba(255, 255, 255, 0.91)');
      // Clip for safety even if a future edit increases pupil travel.
      c.clip();
      this.ellipse(this.gaze.x, this.gaze.y, 8.7, 11, '#212B28');
      this.ellipse(this.gaze.x - 2.8, this.gaze.y - 4.1, 2.5, 2.6, '#FFFFFF');
      this.ellipse(this.gaze.x + 2.2, this.gaze.y + 4, 1.1, 1.1, 'rgba(255, 255, 255, 0.2)');
    }
    c.restore();
  }

  drawBook() {
    const c = this.ctx;
    c.fillStyle = '#1B8C46';
    c.fill(this.paths.bookOutline);
    c.fillStyle = '#F5FFF0';
    c.fill(this.paths.bookTop);
    c.fillStyle = '#F7FAEB';
    c.fill(this.paths.bookSide);
    c.strokeStyle = 'rgba(80, 144, 83, 0.18)';
    c.lineWidth = 1;
    c.beginPath();
    c.moveTo(214, 348);
    c.lineTo(224, 421);
    c.moveTo(211, 351);
    c.lineTo(221, 424);
    c.stroke();
    c.fillStyle = this.gradient(149, 350, 207, 432, [[0, '#2FA643'], [1, '#178843']]);
    c.fill(this.paths.bookCover);
    c.strokeStyle = 'rgba(116, 206, 79, 0.62)';
    c.lineWidth = 2;
    c.beginPath();
    c.moveTo(154, 348);
    c.lineTo(161, 399);
    c.stroke();
    c.fillStyle = this.gradient(151, 383, 181, 423, [[0, '#FFDA29'], [1, '#FFC717']]);
    c.fill(this.paths.bookHand);
  }

  getState() {
    return {
      paused: this.paused, tracking: this.tracking,
      blinking: this.blinking, idleMotion: this.idleMotion,
      eyeOpen: this.eyeOpen, gaze: { ...this.gaze },
      activeTimeMs: this.clock, blinkCount: this.blinkCount,
      nextBlinkInMs: Math.max(0, this.nextBlink - this.clock)
    };
  }

  emitState() {
    this.canvas.dispatchEvent(new CustomEvent('xuebao:statechange', { detail: this.getState() }));
  }

  pause() {
    if (this.destroyed) return;
    this.paused = true;
    this.stopLoop();
    this.emitState();
  }

  resume() {
    if (this.destroyed) return;
    this.paused = false;
    this.startLoop();
    this.emitState();
  }

  blink() {
    if (this.destroyed || this.paused || document.hidden) return false;
    return this.beginBlink(true);
  }

  setTracking(enabled) {
    if (this.destroyed) return;
    this.tracking = Boolean(enabled);
    if (!this.tracking) this.gaze = { x: 0, y: 0 };
    this.draw();
    this.emitState();
  }

  setBlinking(enabled) {
    if (this.destroyed) return;
    this.blinking = Boolean(enabled);
    if (this.blinking) this.nextBlink = this.clock + this.randomBlinkDelay();
    this.emitState();
  }

  setIdleMotion(enabled) {
    if (this.destroyed) return;
    this.idleMotion = Boolean(enabled);
    this.motionWasOverridden = true;
    this.draw();
    this.emitState();
  }

  destroy() {
    if (this.destroyed) return;
    this.stopLoop();
    this.destroyed = true;
    this.observer?.disconnect();
    window.removeEventListener('pointermove', this._pointer);
    window.removeEventListener('pointerdown', this._pointer);
    window.removeEventListener('pointerup', this._pointerEnd);
    window.removeEventListener('pointercancel', this._leave);
    document.documentElement.removeEventListener('pointerleave', this._leave);
    window.removeEventListener('blur', this._leave);
    window.removeEventListener('resize', this._resize);
    document.removeEventListener('visibilitychange', this._visibility);
    this.motionQuery.removeEventListener('change', this._motionChange);
  }
}

  d.innerHTML=`<div class="box" role="dialog" aria-modal="true"><button class="x" id="hd-x" aria-label="關閉">✕</button><h4>授課教師確認</h4><p>授課教師${teacherName}</p>
    <div class="pwrow"><span>點名密碼</span><input id="hd-pw" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="點名密碼"></div>
    <p style="font-size:11.5px;color:var(--muted)">示範：輸入任意 4 位數字即可確認；按「略過」則交由班導師確認。</p>
    <div class="acts"><button class="hbtn light" id="hd-skip">略過</button><button class="hbtn light" id="hd-ok" disabled>確定</button></div></div>`;
  const pw=$('#hd-pw'); pw.focus();
  pw.addEventListener('input',()=>{ pw.value=pw.value.replace(/\D/g,'').slice(0,4); $('#hd-ok').disabled=pw.value.length!==4; });
  $('#hd-x').onclick=()=>{d.hidden=true;};
  const h=H();
  if(periodKey==='p6'){
    $('#hd-ok').onclick=()=>{ d.hidden=true; S.helperMarks={...h.pending}; S.helperDone=true; S.teacherDone=true; h.view='home'; writeBack(S.helperMarks,'課堂點名（小幫手代點・密碼確認）',$('#sis2')); renderH(); };
    $('#hd-skip').onclick=()=>{ d.hidden=true; S.helperMarks={...h.pending}; S.helperSkipped=true; h.view='home'; renderH(); toast('已略過密碼確認','小幫手點名已暫存，已通知授課老師黃婉婷於老師端確認。','warn'); };
  } else {
    const marks={...(h.otherPending&&h.otherPending[periodKey]||{})};
    $('#hd-ok').onclick=()=>{ d.hidden=true; h.otherDone=h.otherDone||{}; h.otherDone[periodKey]=marks; h.view='home'; writeBack(marks,'課堂點名（小幫手代點・密碼確認）',$('#sis2'),row.cls,'第'+row.n+'節'); renderH(); };
    $('#hd-skip').onclick=()=>{ d.hidden=true; h.otherSkipped=h.otherSkipped||{}; h.otherSkipped[periodKey]=true; h.view='home'; renderH(); toast('已略過密碼確認',`${row.cls} 第${row.n}節小幫手點名已暫存，已通知授課教師${teacherName}確認。`,'warn'); };
  }
}

/* ---------- leave prompt ---------- */
function pendingSteps(){
  if(!$('#stage1').hidden&&!S.teacherDone&&T().day===22){
    const L=[]; const t=T();
    if(t.view!=='roll')L.push(['在「今日點名」點 320 午休 那一列','進入點名畫面']);
    L.push(['點大頭照標記缺曠後，按右上「送出」','缺曠才會寫入校務系統']);
    return {role:'老師端',steps:L};
  }
  if(!$('#stage2').hidden&&!S.helperDone&&!S.helperSkipped){
    const L=[]; const h=H();
    if(h.view!=='roll')L.push(['在「今日點名」點 320 午休 那一列','進入代點名畫面']);
    L.push(['點學生右側「--」標記後，按右上「儲存」','會出現授課教師確認視窗']);
    L.push(['在確認視窗輸入密碼按「確定」，或按「略過」','確定＝直接寫回校務系統；略過＝交由班導師確認']);
    return {role:'小幫手',steps:L};
  }
  return null;
}
function openLeave(info){
  const li=info.steps.map(([a,b],i)=>`<li><span class="ln">${i+1}</span><div><b>${a}</b><div class="lsub">${b}</div></div></li>`).join('');
  $('#modalHost').innerHTML=`<div class="modal"><div class="box" role="dialog" aria-modal="true" style="width:min(460px,100%)">
    <h3>${info.role}的流程還沒走完</h3><div class="sub">還有 ${info.steps.length} 個步驟沒有操作：</div><ol class="leftlist">${li}</ol>
    <div class="row"><button class="btn" data-go="0" data-force>仍要返回主選單</button><button class="btn accent" data-close style="min-width:140px">繼續操作</button></div></div></div>`;
}


/* ---------- misclick guide: flash what can be clicked ---------- */
const INTERACTIVE='button,a,input,select,textarea,label,canvas,[role="button"],[tabindex],.pop,.cal,.modal,.pdlg,.ddmenu,.toasts,[data-go]';
function flashTargets(){
  const sels=nextTargets(); if(!sels)return;
  const els=[]; sels.forEach(sel=>$$(sel).forEach(el=>{ if(!el.disabled&&el.offsetParent!==null&&!el.closest('[hidden]'))els.push(el); }));
  const list=els.slice(0,24); if(!list.length)return;
  list.forEach(el=>{ el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),2000); });
  const first=list[0]; const r=first.getBoundingClientRect(); if(r.top<0||r.bottom>window.innerHeight)first.scrollIntoView({block:'center',behavior:'smooth'});
}
document.addEventListener('pointerdown',e=>{
  if(!$('#stage0').hidden)return;                      // home: no guide
  if($('#modalHost').children.length)return;           // a modal is open
  if(e.target.closest(INTERACTIVE))return;             // clicked something real
  flashTargets();
},true);
function nextTargets(){
  if(!$('#stage1').hidden){
    if(!$('#t-dlg').hidden)return ['#t-dlg button:not([disabled])'];
    const t=T();
    if(t.view==='home'){ return S.teacherDone?['#t-view [data-pickperiod]','#t-view [data-t="roll"]','#done1 .btn']:['#t-view [data-t="roll"][data-period="p6"]']; }
    if(t.view==='roll'){ const locked=!$('#t-send')||$('#t-send').disabled; return locked?['#t-view .back']:['#t-view .card[data-stu]','#t-send']; }
    if(t.view==='settings')return ['#t-view [data-t="pickHelper"]','#t-view .back'];
    if(t.view==='pickHelper')return ['#t-view [data-pick]','#t-savehelper'];
  }
  if(!$('#stage2').hidden){
    if(!$('#h-dlg').hidden)return ['#h-dlg button:not([disabled])','#hd-pw'];
    const h=H();
    if(h.view==='home'){ return (S.helperDone||S.teacherDone)?['#h-view .pbanner .btn-s','#h-view [data-h="roll"]']:['#h-view [data-h="roll"][data-period="p6"]']; }
    const locked=!$('#h-save')||$('#h-save').disabled; return locked?['#h-view .back']:['#h-view .stb[data-stu]','#h-save'];
  }
  return null;
}
